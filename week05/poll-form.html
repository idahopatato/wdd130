<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="styles/formstyles.css">
</head>
<body>
    <header>
        <h1>WDD 130 | HTML Forms - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item label-narrow">
                    <label for="fullname">Full Name</label>
                    <input type="text" name="fullname" id="fullname" required>
                </div>
                <div class="form-item label-narrow">
                    <label for="useremail">Email</label>
                    <input type="email" name="useremail" id="useremail" required>            
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div class="form-item label-wide">
                    <label for="browser">What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Google Chrome</option>
                        <option value="safari">Apple Safari</option>
                        <option value="edge">Microsoft Edge</option>
                    </select>
                </div>
                <div class="form-item label-wide">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="form-item">
                    <label for="places">List the places you have lived:</label>
                    <textarea name="places" id="places" placeholder="Los Angeles, Salt Lake City, Boise, etc"></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>Footer Content \ Colby Otte | WDD 130</p>
    </footer>
    
</body>
</html>
