<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Exciting Expeditions</title>
    <meta name="description" content="Contact us for an exciting white water rafting trip!!">
    <meta name="author" content="Colby Otte">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Exciting Expeditions logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>

        <div class="grid">
            <iframe src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d11742.052780670383!2d-113.76244024094179!3d42.52607850957266!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1795642139042!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form class="grid">
                <label class="leftform" for="name">Name</label>
                <input class="rightform" type="text" id="name" name="name" required>
                <label class="leftform" for="email">Email</label>
                <input class="rightform" type="email" id="email" name="email" required>
                <label class="leftform">Message Purpose</label>
                <div class="rightform">
                    <div class="radios">
                        <input type="radio" id="general" name="inquiry" value="general">
                        <label for="general">General inquiry</label>
                        <input type="radio" id="reservation" name="inquiry" value="reservation">
                        <label for="reservation">Reservation Question</label>
                        <input type="radio" id="suggestion" name="inquiry" value="suggestion">
                        <label for="suggestion">Website Suggestions</label>
                    </div>
                </div>
                <div class="message">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Enter message here"></textarea>
                </div>
                <div class="checkbox">
                    <input type="checkbox" id="sub" name="sub">
                    <label for="sub">Please Subscribe me to the monthly newsletter?</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>


        <section class="employees">
            <h2>We Are Here to Serve You!</h2>
            <figure>
                <img src="images/employees/jason.jpg" alt="Jason David">
                <figcaption>Jason David<br><span class="jobtitle">Guide in Cheif</span></figcaption>
            </figure>
            <figure>
                <img src="images/employees/maxine.jpg" alt="Maxine Gillis">
                <figcaption>Maxine Gillis<br><span class="jobtitle"> Senior Guide</span></figcaption>
            </figure>
            <figure>
                <img src="images/employees/gilderoy.jpg" alt="Gilderoy Lockhart">
                <figcaption>Gilderoy Lockhart<br><span class="jobtitle">Junior Guide</span></figcaption>
            </figure>
        </section>


    </main>

    <footer>
        <p> © 2026 Exciting Expeditions | Colby Otte</p>
        <nav class="socialmedia">
            <a href="www.facebook.com">
                <img src="images/facebook.svg" alt="facebook logo">
            </a>
            <a href="www.instagram.com">
                <img src="images/instagram.svg" alt="instagram logo">
            </a>
            <a href="www.youtube.com">
                <img src="images/youtube.svg" alt="youtube logo">
            </a>
        </nav>
    </footer>
</body>

</html>
